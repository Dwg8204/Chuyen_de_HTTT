version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: musicrec_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: musicrec
    volumes:
      - mongodb_data:/data/db
    networks:
      - musicrec_network

  redis:
    image: redis:7.2-alpine
    container_name: musicrec_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - musicrec_network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  musicrec_network:
    driver: bridge
